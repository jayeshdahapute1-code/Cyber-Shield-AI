name: Build CyberShield AI APKs

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Safe Install + Full Protection releases
        run: gradle --no-daemon assembleSafeRelease assembleFullRelease --stacktrace

      - name: Upload Safe Install APK
        uses: actions/upload-artifact@v4
        with:
          name: CyberShieldAI-SafeInstall
          path: app/build/outputs/apk/safe/release/app-safe-release.apk

      - name: Upload Full Protection APK
        uses: actions/upload-artifact@v4
        with:
          name: CyberShieldAI-FullProtection
          path: app/build/outputs/apk/full/release/app-full-release.apk
